name: flutter_and_friends
description: The official Flutter & Friends conference app.
publish_to: none
repository: https://github.com/flutter-and-friends/flutter_and_friends
version: 1.3.0+27

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0 <4.0.0"

dependencies:
  bloc: ^9.0.0
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.8.0
  equatable: ^2.0.5
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_svg: ^2.0.0
  font_awesome_flutter: ^11.0.0
  friends_badge: ^0.2.2
  google_fonts: ^8.2.1
  http: ^1.2.0
  hydrated_bloc: ^11.0.0
  image: ^4.5.4
  image_picker: ^1.2.0
  integral_isolates: ^0.5.0
  intl: ^0.20.0
  json_annotation: ^4.9.0
  nfc_manager: ^4.1.0
  path_provider: ^2.0.0
  pub_semver: ^2.1.4
  shorebird_code_push: ^2.0.2
  url_launcher: ^6.0.0

dev_dependencies:
  bloc_lint: ^0.4.2
  build_runner: ^2.4.12
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0
  melos: ^8.6.0
  very_good_analysis: ^10.0.0

flutter:
  assets:
    - assets/
    - assets/activities/
    - assets/schedule/
    - assets/sponsors/
    - assets/organizers/
    - assets/badge_templates/capybaras/
    - shorebird.yaml
  uses-material-design: true

melos:
  useRootAsPackage: true
  command:
    version:
      branch: main
      releaseUrl: true
      includeCommitId: true
      linkToCommits: true
      workspaceChangelog: false
