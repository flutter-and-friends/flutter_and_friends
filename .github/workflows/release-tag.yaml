name: Tag release

on:
  push:
    branches: [main]

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  tag-release:
    name: 🏷️ Tag release and start release build
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'chore(release)')
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: 🐦 Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: ^8.6.0

      # Melos 8.6 tags the root package with plain v<version> tags, which is
      # also the format it looks for when computing the next release, so the
      # tag is created here instead of with the action's tag input (that one
      # still uses <package>-v<version>).
      - name: 🏷️ Create and push tag
        run: |
          melos exec -c 1 --private -- git tag v\$MELOS_PACKAGE_VERSION
          for tag in $(git tag --points-at HEAD); do git push origin "$tag"; done

      # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the
      # release workflow is started explicitly on the new tag.
      - name: 🚀 Start release workflow
        run: |
          melos exec -c 1 --private -- \
          gh workflow run release.yaml --ref v\$MELOS_PACKAGE_VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
