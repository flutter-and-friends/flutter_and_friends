# Squash merges use the PR title as the commit message, and melos derives the
# next version and the changelog from those commit messages, so PR titles must
# follow the conventional commits format.
# See https://github.com/amannn/action-semantic-pull-request
name: PR title is conventional

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    name: ✅ Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          subjectPattern: ^[^a-z].+$
          subjectPatternError: |
            The subject of the PR can't begin with a lowercase letter.
